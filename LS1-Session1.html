<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LS1 - Session 1 | Vital Functions | Mr. Ríos</title>
<style>
:root {
  --scale: 1;
  --bg-1:#ffe9ec;
  --bg-2:#ffd8de;
  --bg-3:#ffc6cf;
  --cell-red:#d94b5f;
  --cell-dark:#8f2d3c;
  --cell-soft:#f8a4b2;
  --tissue:#f3c1c8;
  --ink:#3a2529;
  --card:#fffdfdee;
  --blue:#dff2ff;
  --yellow:#fff4bf;
  --pink:#ffe0e7;
  --purple:#eee4ff;
  --shadow:0 14px 34px rgba(95,35,49,.16);
}
* { box-sizing:border-box; }
html, body { margin:0; width:100%; height:100%; overflow:hidden; font-family: Inter, "Segoe UI", Arial, sans-serif; color:var(--ink); background:radial-gradient(circle at 20% 15%, #ffd7df 0 8%, transparent 9%), radial-gradient(circle at 80% 25%, #ffc3cf 0 6%, transparent 7%), linear-gradient(135deg,#ffeef1 0%,#ffdbe1 50%,#ffcbd4 100%); }
body::before {
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.33;
  background-image:
    radial-gradient(circle at 18px 18px, rgba(198,61,82,.28) 0 8px, rgba(255,255,255,.35) 9px 13px, transparent 14px),
    radial-gradient(circle at 48px 42px, rgba(232,108,128,.25) 0 6px, rgba(255,255,255,.3) 7px 10px, transparent 11px),
    radial-gradient(circle at 85px 20px, rgba(155,45,66,.2) 0 10px, rgba(255,255,255,.28) 11px 15px, transparent 16px);
  background-size:130px 110px;
}
button { font:inherit; }
.app { height:100vh; display:grid; grid-template-rows:auto 1fr auto; position:relative; z-index:1; }
header {
  background:rgba(255,255,255,.94); backdrop-filter:blur(10px); border-bottom:3px solid #f0a4b1;
  padding:10px 16px 8px; box-shadow:0 4px 18px rgba(117,40,58,.08);
}
.topline { display:flex; align-items:center; gap:12px; justify-content:space-between; }
.brand { display:flex; align-items:center; gap:10px; min-width:210px; }
.logo { width:42px; height:42px; border-radius:50%; display:grid; place-items:center; background:#d94b5f; color:white; font-size:24px; box-shadow:0 4px 10px #0001; }
.brandtext strong { display:block; font-size:calc(1.02rem * var(--scale)); }
.brandtext span { font-size:calc(.78rem * var(--scale)); color:#55715c; }
.controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:flex-end; }
.control-btn {
  border:0; border-radius:14px; background:#fff0f3; color:#8f2d3c; padding:9px 13px; min-width:48px;
  font-weight:800; cursor:pointer; transition:.18s; border:2px solid transparent;
}
.control-btn:hover,.control-btn.active { background:#d94b5f; color:#fff; transform:translateY(-1px); }
nav { display:flex; gap:8px; overflow-x:auto; padding-top:9px; scrollbar-width:thin; }
.nav-btn {
  flex:0 0 auto; border:0; background:#fff1f4; border-radius:999px; padding:8px 12px; cursor:pointer;
  font-size:calc(.79rem * var(--scale)); font-weight:800; color:#7b3b48;
}
.nav-btn.active { background:#a9364a; color:#fff; }
main { min-height:0; padding:12px 16px; }
.slide { display:none; width:100%; height:100%; }
.slide.active { display:block; animation:fade .22s ease; }
@keyframes fade { from { opacity:.3; transform:translateY(5px); } to { opacity:1; transform:none; } }
.panel {
  width:min(1180px,100%); height:100%; margin:auto; background:var(--card); border:3px solid #f2b2be;
  border-radius:28px; padding:18px; box-shadow:var(--shadow); overflow:auto;
}
.hero { display:grid; grid-template-columns:1.02fr .98fr; gap:18px; align-items:center; height:100%; }
.hero img { width:100%; max-height:72vh; object-fit:contain; border-radius:22px; border:3px solid #f3bbc5; background:#fff; }
.kicker { display:inline-flex; gap:8px; align-items:center; background:#ffe0e6; color:#9b3245; border-radius:999px; padding:8px 13px; font-weight:900; font-size:calc(.82rem * var(--scale)); }
h1 { font-size:calc(2.35rem * var(--scale)); line-height:1.03; margin:12px 0 8px; color:#9d3145; }
h2 { font-size:calc(1.65rem * var(--scale)); margin:0 0 10px; color:#2f6f36; }
h3 { font-size:calc(1.12rem * var(--scale)); margin:8px 0; }
p,li { font-size:calc(1rem * var(--scale)); line-height:1.45; }
.lead { font-size:calc(1.17rem * var(--scale)); }
.step-tag { font-weight:950; letter-spacing:.06em; font-size:calc(.76rem * var(--scale)); color:#6b7b66; text-transform:uppercase; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:stretch; }
.grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.card { background:#fff; border:2px solid #f2c3cb; border-radius:20px; padding:14px; box-shadow:0 7px 16px #3452; }
.note { background:#fff0f3; border-left:7px solid #d94b5f; padding:12px 14px; border-radius:14px; }
.image-card { display:flex; align-items:center; justify-content:center; background:#fff; border-radius:22px; border:2px solid #f2c3cb; padding:10px; min-height:0; }
.image-card img { width:100%; max-height:66vh; object-fit:contain; border-radius:14px; }
.answer-grid { display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-top:12px; }
.answer {
  border:3px solid #f1c5cc; background:#fff; border-radius:18px; min-height:62px; padding:12px 14px; cursor:pointer;
  font-weight:850; text-align:left; transition:.16s; font-size:calc(.96rem * var(--scale));
}
.answer:hover { border-color:#d94b5f; transform:translateY(-2px); }
.answer.correct { border-color:#c53d52; background:#ffe9ed; }
.answer.wrong { border-color:#dc7b7b; background:#fff0f0; }
.feedback {
  min-height:45px; margin-top:10px; border-radius:15px; padding:9px 12px; display:flex; align-items:center;
  font-weight:900; font-size:calc(.95rem * var(--scale));
}
.feedback.ok { background:#ffe8ec; color:#9a2e43; animation:pop .28s ease; }
.feedback.no { background:#fff1f1; color:#a33c3c; }
@keyframes pop { 0%{ transform:scale(.95); } 70%{ transform:scale(1.03); } 100%{ transform:scale(1); } }
.starburst { position:fixed; inset:0; pointer-events:none; z-index:30; overflow:hidden; }
.star { position:absolute; font-size:28px; animation:fly .9s ease forwards; }
@keyframes fly { from{ opacity:1; transform:translateY(0) scale(.7) rotate(0); } to{ opacity:0; transform:translateY(-120px) scale(1.3) rotate(180deg); } }
footer {
  padding:9px 16px 12px; display:flex; align-items:center; gap:12px; justify-content:space-between;
  background:rgba(255,255,255,.9); border-top:2px solid #efb6c0;
}
.big-btn { border:0; border-radius:16px; padding:12px 20px; font-weight:950; cursor:pointer; min-width:130px; background:#a9364a; color:white; font-size:calc(.94rem * var(--scale)); }
.big-btn.secondary { background:#ffe8ec; color:#8f2d3c; }
.big-btn:disabled { opacity:.35; cursor:not-allowed; }
.progress-wrap { flex:1; max-width:520px; }
.progress { height:12px; border-radius:999px; background:#f6d8de; overflow:hidden; }
.progress > div { height:100%; width:0; background:linear-gradient(90deg,#f17b8f,#a9364a); transition:.2s; }
.counter { text-align:center; font-weight:900; color:#7f4a55; font-size:calc(.82rem * var(--scale)); margin-bottom:4px; }
.icon-row { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0; }
.pill { background:#fff3f5; border:2px solid #efbcc6; padding:8px 12px; border-radius:999px; font-weight:800; font-size:calc(.88rem * var(--scale)); }
.match-list { display:grid; gap:10px; }
.match-item { display:grid; grid-template-columns:1.1fr 1fr; gap:10px; align-items:center; }
select { width:100%; padding:11px; border-radius:13px; border:2px solid #efbdc7; background:white; font-size:calc(.92rem * var(--scale)); }
.quiz-q { margin-bottom:14px; padding-bottom:12px; border-bottom:1px dashed #c7dcc0; }
.quiz-q:last-child { border-bottom:0; }
.small { font-size:calc(.82rem * var(--scale)); color:#7c5b62; }
.result-box { background:#fff1f4; border:3px dashed #d96b7d; border-radius:20px; padding:14px; margin-top:12px; font-weight:900; }
@media (max-width:900px) {
  .hero,.grid2 { grid-template-columns:1fr; }
  .hero img,.image-card img { max-height:34vh; }
  .grid3 { grid-template-columns:1fr; }
  .answer-grid { grid-template-columns:1fr; }
  .panel { padding:14px; border-radius:20px; }
  .brandtext span { display:none; }
  .controls { gap:5px; }
  .control-btn { padding:7px 10px; }
}
</style>
</head>

  <button class="big-btn" id="nextBtn" data-en="Next →" data-es="Siguiente →"></button>
</footer>
</div>

<div class="starburst" id="starburst"></div>

<script>
const slides = [...document.querySelectorAll('.slide')];
const menu = document.getElementById('menu');
let current = 0;
let lang = 'en';

function t(el) {
  const val = el.dataset[lang];
  if (val !== undefined) el.textContent = val;
}

function applyLanguage() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-en][data-es]').forEach(t);
  document.getElementById('enBtn').classList.toggle('active', lang==='en');
  document.getElementById('esBtn').classList.toggle('active', lang==='es');
  buildMenu();
  updateNav();
}

function buildMenu() {
  menu.innerHTML = '';
  slides.forEach((s,i) => {
    const b = document.createElement('button');
    b.className = 'nav-btn' + (i===current ? ' active' : '');
    b.textContent = lang==='en' ? s.dataset.titleEn : s.dataset.titleEs;
    b.onclick = () => showSlide(i);
    menu.appendChild(b);
  });
}

function showSlide(i) {
  current = Math.max(0, Math.min(slides.length-1, i));
  slides.forEach((s,idx)=>s.classList.toggle('active',idx===current));
  buildMenu();
  updateNav();
}

function updateNav() {
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===slides.length-1;
  document.getElementById('counter').textContent =
    (lang==='en' ? 'Screen ' : 'Pantalla ') + (current+1) + ' / ' + slides.length;
  document.getElementById('bar').style.width = ((current+1)/slides.length*100) + '%';
}

document.getElementById('prevBtn').onclick = () => showSlide(current-1);
document.getElementById('nextBtn').onclick = () => showSlide(current+1);
document.getElementById('enBtn').onclick = () => {lang='en'; applyLanguage();};
document.getElementById('esBtn').onclick = () => {lang='es'; applyLanguage();};

document.querySelectorAll('[data-size]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.documentElement.style.setProperty('--scale', btn.dataset.size);
    document.querySelectorAll('[data-size]').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
  });
});

function celebrate() {
  const box = document.getElementById('starburst');
  const symbols = ['⭐','✨','🌟','✅'];
  for(let i=0;i<9;i++) {
    const s = document.createElement('div');
    s.className='star';
    s.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    s.style.left=(35+Math.random()*30)+'%';
    s.style.top=(52+Math.random()*18)+'%';
    s.style.animationDelay=(Math.random()*.15)+'s';
    box.appendChild(s);
    setTimeout(()=>s.remove(),1100);
  }
}

function setFeedback(id, ok) {
  const fb=document.getElementById(id);
  fb.className='feedback ' + (ok ? 'ok':'no');
  fb.textContent = ok ? (lang==='en' ? 'Correct! ⭐ Great job!' : '¡Correcto! ⭐ ¡Muy bien!')
                      : (lang==='en' ? 'Try again!' : '¡Inténtalo de nuevo!');
  if(ok) celebrate();
}

document.querySelectorAll('.answer-grid[data-question]').forEach(group => {
  group.querySelectorAll('button.answer').forEach(btn => {
    btn.addEventListener('click', () => {
      const q=group.dataset.question;
      if(btn.dataset.correct==='true') {
        group.querySelectorAll('.answer').forEach(x=>x.classList.remove('wrong','correct'));
        btn.classList.add('correct');
        setFeedback(q+'fb', true);
      } else {
        btn.classList.add('wrong');
        setFeedback(q+'fb', false);
        setTimeout(()=>btn.classList.remove('wrong'),500);
      }
    });
  });
});

document.getElementById('checkMatch').onclick = () => {
  const sels=[...document.querySelectorAll('[data-match]')];
  const allFilled=sels.every(s=>s.value);
  const ok=allFilled && sels.every(s=>s.value===s.dataset.match);
  setFeedback('matchfb', ok);
};

document.getElementById('finalCheck').onclick = () => {
  const qs=[...document.querySelectorAll('.finalq')];
  let score=0, answered=0;
  qs.forEach(q=>{
    const pick=q.querySelector('input:checked');
    q.querySelectorAll('.answer').forEach(l=>l.classList.remove('correct','wrong'));
    if(pick) {
      answered++;
      const lab=pick.closest('.answer');
      if(pick.value===q.dataset.answer) {score++; lab.classList.add('correct');}
      else {lab.classList.add('wrong');}
    }
  });
  const out=document.getElementById('finalResult');
  out.style.display='block';
  if(answered<qs.length) {
    out.textContent = lang==='en' ? 'Answer all five questions first.' : 'Primero responde las cinco preguntas.';
    return;
  }
  if(score===5) {
    out.textContent = lang==='en' ? '5 / 5 — Excellent! You are ready for the next session. 🌟'
                                  : '5 / 5 — ¡Excelente! Estás preparado para la siguiente sesión. 🌟';
    celebrate();
  } else if(score>=3) {
    out.textContent = (lang==='en' ? `${score} / 5 — Good work! Review the questions you missed and try again.`
                                   : `${score} / 5 — ¡Buen trabajo! Revisa las preguntas que has fallado e inténtalo otra vez.`);
  } else {
    out.textContent = (lang==='en' ? `${score} / 5 — Keep practising. Go back to the explanations and try again.`
                                   : `${score} / 5 — Sigue practicando. Vuelve a las explicaciones e inténtalo otra vez.`);
  }
};

applyLanguage();
showSlide(0);
</script>
</body>
</html>
