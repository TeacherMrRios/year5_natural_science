:root{--scale:1;--ink:#17334c;--blue:#1779cf;--green:#159b75;--pink:#ef6d9b}*{box-sizing:border-box}body{margin:0;font-family:'Trebuchet MS',Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,#d5f9dc,transparent 35%),radial-gradient(circle at 90% 20%,#c6e7ff,transparent 40%),#f6fcff;font-size:calc(19px * var(--scale))}header{background:#fffdf5eF;border-bottom:3px solid #d8e8ef;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-weight:900;color:#157d6b}.tools{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:2px solid #c5dfe9;background:white;border-radius:14px;padding:10px 14px;color:var(--ink);font-weight:700}button:hover{filter:brightness(.97)}button:focus-visible{outline:3px solid #f5ac36}button.primary{background:#187bc4;color:white;border-color:#187bc4}button.active{background:#d4f7e9;border-color:#1d9a70}main{max-width:1100px;margin:18px auto;padding:0 18px}.hero{text-align:center;margin-bottom:16px}.hero h1{font-size:calc(34px * var(--scale));margin:0}.hero p{margin:7px;color:#53687a}.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:15px}.tabs button{font-size:calc(14px * var(--scale));padding:9px 12px}.screen{display:none;background:#ffffffed;border:3px solid #d9edf5;border-radius:25px;padding:clamp(16px,3vw,32px);min-height:460px;box-shadow:0 12px 28px #174e6914}.screen.on{display:block}.screen h2{font-size:calc(28px * var(--scale));margin:0 0 8px}.sub{color:#5d7281;margin:0 0 22px}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.option{min-height:70px;background:#f0f9ff;border:2px solid #c4e6fb}.option.selected{background:#d2f8e9;border-color:#13966c}.question{padding:17px;background:#f5f9ff;border-radius:18px;margin:12px 0;font-weight:800}.feedback{min-height:42px;margin-top:14px;font-weight:900;color:#08775b}.feedback.bad{color:#b74b63}.nav{display:flex;justify-conten const steps=['Mouth','Oesophagus','Stomach','Small intestine','Large intestine'];const organs=['Mouth','Oesophagus','Stomach','Small intestine','Large intestine','Liver','Pancreas','Rectum','Anus'];
const data={en:{title:'🍎 The Digestion Games',subtitle:'LS2 · Session 2 · Play, practise and win stars!',tabs:['Order the journey','Match the functions','Guess the organ','Fill the gaps','True or false','Final challenge'],prev:'← Previous',next:'Next →',check:'Check answers',reset:'Try again',correct:'🌟 Correct!',wrong:'Try again!',done:'🎉 Amazing work, scientists!',instructions:['Tap the stages in the correct order.','Choose an organ, then its matching function.','Choose the correct answer.','Choose the missing word in each sentence.','Decide whether each sentence is true or false.','Answer all five questions to complete the mission!'],questions:[['Where does food mix with gastric juices?',['Stomach','Liver','Mouth'],0],['Which organ absorbs nutrients into the blood?',['Large intestine','Small intestine','Oesophagus'],1],['Which organ produces bile?',['Pancreas','Stomach','Liver'],2],['Where are water and minerals absorbed?',['Large intestine','Mouth','Rectum'],0],['Which part pushes food towards the stomach?',['Small intestine','Oesophagus','Anus'],1]],fills:[['The teeth break food into smaller _____.',['pieces','lungs','bones'],0],['Saliva makes food _____.',['dry','wet','hard'],1],['The stomach turns food into a liquid called _____.',['bile','saliva','chyme'],2],['The liver produces _____.',['bile','faeces','saliva'],0],['The pancreas produces pancreatic _____.',['bones','juices','teeth'],1],['Faeces leave the body through the _____.',['mouth','stomach','anus'],2]],truth:[['The tongue helps form a food bolus.',true],['The oesophagus produces bile.',false],['Nutrients are absorbed in the small intestine.',true],['The liver produces pancreatic juices.',false],['Faeces pass into the rectum.',true]],final:[['What is the correct first stage?',['Mouth','Stomach','Large intestine'],0],['What pushes the food bolus to the stomach?',['Liver','Oesophagus','Pancreas'],1],['What is the paste formed in the stomach called?',['Bile','Saliva','Chyme'],2],['What is absorbed in the large intestine?',['Water and minerals','Oxygen','Saliva'],0],['Where do faeces leave the body?',['Rectum','Anus','Small intestine'],1]],pairNames:['Mouth','Oesophagus','Stomach','Small intestine','Large intestine','Liver','Pancreas','Rectum','Anus'],pairFunctions:['Chews food and mixes it with saliva.','Pushes the food bolus to the stomach.','Mixes food with gastric juices to form chyme.','Absorbs nutrients into the blood.','Absorbs water and minerals.','Produces bile.','Produces pancreatic juices.','Receives faeces before they leave the body.','Faeces leave the body here.'],true:'True',false:'False',stars:'Stars'},es:{title:'🍎 Juegos de la digestión',subtitle:'LS2 · Sesión 2 · ¡Juega, practica y gana estrellas!',tabs:['Ordena el recorrido','Une las funciones','Adivina el órgano','Completa frases','Verdadero o falso','Reto final'],prev:'← Anterior',next:'Siguiente →',check:'Comprobar',reset:'Intentar de nuevo',correct:'🌟 ¡Correcto!',wrong:'¡Inténtalo de nuevo!',done:'🎉 ¡Gran trabajo, científicos!',instructions:['Pulsa las etapas en el orden correcto.','Elige un órgano y después su función.','Elige la respuesta correcta.','Elige la palabra que falta en cada frase.','Decide si cada frase es verdadera o falsa.','¡Responde las cinco preguntas para completar la misión!'],questions:[['¿Dónde se mezclan los alimentos con los jugos gástricos?',['Estómago','Hígado','Boca'],0],['¿Qué órgano absorbe nutrientes a la sangre?',['Intestino grueso','Intestino delgado','Esófago'],1],['¿Qué órgano produce bilis?',['Páncreas','Estómago','Hígado'],2],['¿Dónde se absorben agua y minerales?',['Intestino grueso','Boca','Recto'],0],['¿Qué parte empuja los alimentos hacia el estómago?',['Intestino delgado','Esófago','Ano'],1]],fills:[['Los dientes rompen los alimentos en _____ más pequeños.',['trozos','pulmones','huesos'],0],['La saliva _____ los alimentos.',['seca','humedece','endurece'],1],['El estómago convierte los alimentos en una masa llamada _____.',['bilis','saliva','quimo'],2],['El hígado produce _____.',['bilis','heces','saliva'],0],['El páncreas produce _____ pancreáticos.',['huesos','jugos','dientes'],1],['Las heces salen del cuerpo por el _____.',['boca','estómago','ano'],2]],truth:[['La lengua ayuda a formar el bolo alimenticio.',true],['El esófago produce bilis.',false],['Los nutrientes se absorben en el intestino delgado.',true],['El hígado produce jugos pancreáticos.',false],['Las heces pasan al recto.',true]],final:[['¿Cuál es la primera etapa?',['Boca','Estómago','Intestino grueso'],0],['¿Qué empuja el bolo alimenticio al estómago?',['Hígado','Esófago','Páncreas'],1],['¿Cómo se llama la masa que se forma en el estómago?',['Bilis','Saliva','Quimo'],2],['¿Qué se absorbe en el intestino grueso?',['Agua y minerales','Oxígeno','Saliva'],0],['¿Por dónde salen las heces del cuerpo?',['Recto','Ano','Intestino delgado'],1]],pairNames:['Boca','Esófago','Estómago','Intestino delgado','Intestino grueso','Hígado','Páncreas','Recto','Ano'],pairFunctions:['Mastica los alimentos y los mezcla con saliva.','Empuja el bolo alimenticio hacia el estómago.','Mezcla alimentos con jugos gástricos y forma quimo.','Absorbe nutrientes a la sangre.','Absorbe agua y minerales.','Produce bilis.','Produce jugos pancreáticos.','Recibe las heces antes de salir del cuerpo.','Por aquí salen las heces.'],true:'Verdadero',false:'Falso',stars:'Estrellas'}};
let lang='en',index=0,points=new Set(),ordered=[],chosenPair=null,paired=new Set(),qIndex=0,answers={};const $=id=>document.getElementById(id),t=()=>data[lang];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function size(n){document.documentElement.style.setProperty('--scale',n===0?1:n<0?.85:1.22)}function toggleLang(){lang=lang==='en'?'es':'en';$('lang').textContent=lang==='en'?'🇪🇸 ES':'🇬🇧 EN';ordered=[];paired.clear();chosenPair=null;qIndex=0;answers={};points.clear();render()};function go(n){index=Math.max(0,Math.min(5,n));ordered=[];paired.clear();chosenPair=null;qIndex=0;answers={};render();window.scrollTo({top:0,behavior:'smooth'})}function fb(msg,ok){const el=$('feedback');el.textContent=msg;el.className='feedback'+(ok?'':' bad')};function award(){points.add(index);updateProgress()}function updateProgress(){$('progress').textContent=`⭐ ${points.size}/6 ${t().stars}`};function render(){const d=t();$('title').textContent=d.title;$('subtitle').textContent=d.subtitle;$('prev').textContent=d.prev;$('next').textContent=d.next;$('prev').disabled=index===0;$('next').disabled=index===5;$('tabs').innerHTML=d.tabs.map((s,i)=>`<button class="${i===index?'active':''}" onclick="go(${i})">${i+1}. ${esc(s)}</button>`).join('');let body='';if(index===0)body=orderHTML();if(index===1)body=pairHTML();if(index===2)body=quizHTML('questions');if(index===3)body=fillHTML();if(index===4)body=truthHTML();if(index===5)body=quizHTML('final');$('screens').innerHTML=`<section class="screen on"><h2>${esc(d.tabs[index])} 🎮</h2><p class="sub">${esc(d.instructions[index])}</p>${body}<div id="feedback" class="feedback" aria-live="polite"></div></section>`;updateProgress()}
function orderHTML(){let labels=lang==='en'?steps:['Boca','Esófago','Estómago','Intestino delgado','Intestino grueso'];return `<div class="chips">${[2,4,0,3,1].map(i=>`<button class="chip ${ordered.includes(i)?'used':''}" onclick="pickStep(${i})">${esc(labels[i])}</button>`).join('')}</div><div class="slots">${Array.from({length:5},(_,i)=>`<div class="slot"><span>${i+1}.</span>${ordered[i]===undefined?'_____':`<b>${esc(labels[ordered[i]])}</b>`}</div>`).join('')}</div><div class="row"><button class="primary" onclick="checkOrder()">${t().check}</button><button onclick="ordered=[];render()">↻ ${t().reset}</button></div>`}function pickStep(i){if(ordered.includes(i))return;ordered.push(i);render()}function checkOrder(){if(ordered.length===5&&ordered.every((v,i)=>v===i)){award();fb(t().correct,true)}else fb(t().wrong,false)}
function pairHTML(){let d=t(),order=[3,6,0,8,2,5,1,7,4];return `<div class="pair"><div class="pairs">${d.pairNames.map((s,i)=>`<button class="${paired.has(i)?'done':chosenPair===i?'chosen':''}" onclick="selectPair(${i})">${esc(s)}</button>`).join('')}</div><div class="pairs">${order.map(i=>`<button class="${paired.has(i)?'done':''}" onclick="matchPair(${i})">${esc(d.pairFunctions[i])}</button>`).join('')}</div></div><div class="row"><button onclick="paired.clear();chosenPair=null;render()">↻ ${d.reset}</button><span class="score">${paired.size}/9</span></div>`}function selectPair(i){if(paired.has(i))return;chosenPair=i;render()}function matchPair(i){if(chosenPair===null||paired.has(i))return fb(t().wrong,false);if(chosenPair!==i)return fb(t().wrong,false);paired.add(i);chosenPair=null;render();fb(paired.size===9?t().done:t().correct,true);if(paired.size===9)award()}
function quizHTML(key){let list=t()[key],q=list[qIndex];return `<div class="question">${qIndex+1}/${list.length} · ${esc(q[0])}</div><div class="options">${q[1].map((a,i)=>`<button class="option" onclick="answerQuiz('${key}',${i})">${'ABC'[i]}) ${esc(a)}</button>`).join('')}</div><p class="muted">${qIndex+1} / ${list.length}</p>`}function answerQuiz(key,i){let list=t()[key];if(i!==list[qIndex][2])return fb(t().wrong,false);if(qIndex===list.length-1){award();$('screens').querySelector('section').innerHTML=`<h2>${t().done}</h2><p class="complete">⭐⭐⭐⭐⭐</p><button class="primary" onclick="qIndex=0;render()">↻ ${t().reset}</button>`;return}qIndex++;render();fb(t().correct,true)}
function fillHTML(){let qs=t().fills;return qs.map((q,i)=>`<div class="card"><div><b>${i+1}. ${esc(q[0])}</b></div><div class="row"><select id="fill${i}"><option value="">— ? —</option>${q[1].map((o,j)=>`<option value="${j}">${esc(o)}</option>`).join('')}</select></div></div>`).join('')+`<button class="primary" onclick="checkSelects('fills')">${t().check}</button>`}function truthHTML(){return t().truth.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q[0])}</b><div class="row"><select id="fill${i}"><option value="">— ? —</option><option value="true">${t().true}</option><option value="false">${t().false}</option></select></div></div>`).join('')+`<button class="primary" onclick="checkSelects('truth')">${t().check}</button>`}function checkSelects(key){let all=t()[key].every((q,i)=>{let v=$('fill'+i).value;return key==='fills'?v!==''&&Number(v)===q[2]:v!==''&&(v==='true')===q[1]});if(all){award();fb(t().done,true)}else fb(t().wrong,false)}render();
</script></body></html>
