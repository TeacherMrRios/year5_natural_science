function placeGroup(g){if(selected===null)return;let ok=(selected>=8?'glands':'tract')===g;if(ok){groupPlaced[selected]=g;selected=null;render()}else $('feedback').textContent=t('Try again!','¡Inténtalo de nuevo!')}
const matchIds=[0,2,3,4,5,7,8,9,10];let matchIndex=0;
function matchScreen(){let id=matchIds[matchIndex%matchIds.length];let opts=[id,(id+3)%11,(id+6)%11].sort((a,b)=>((a*7+matchIndex*3)%13)-((b*7+matchIndex*3)%13));return `<h1>🎯 ${t('Match the function','Une cada función')}</h1><p class="sub">${t('Which organ matches this function?','¿Qué órgano corresponde a esta función?')}</p><div class="score">${matchIndex+1} / ${matchIds.length}</div><p class="question">${descriptions[id][lang==='en'?0:1]}</p><div class="choices">${opts.map(i=>`<button class="choice" onclick="checkMatch(this,${i},${id})">${names[i]}</button>`).join('')}</div><p id="feedback" class="feedback"></p><button class="primary" onclick="matchIndex=(matchIndex+1)%${matchIds.length};render()">${t('Next question →','Siguiente pregunta →')}</button>`}
function checkMatch(el,i,id){if(i===id){el.classList.add('correct');$('feedback').textContent=t('⭐ Correct!','⭐ ¡Correcto!')}else{el.classList.add('wrong');$('feedback').textContent=t('Try again!','¡Inténtalo de nuevo!')}}
const path=[0,1,2,3,4,5,6,7];function orderScreen(){return `<h1>➡️ ${t('The food journey','El viaje de los alimentos')}</h1><p class="sub">${t('Tap the organs in the order food passes through them.','Pulsa los órganos en el orden por el que pasa la comida.')}</p><div class="score">${order.length} / 8</div><div class="slots">${Array.from({length:8},(_,i)=>`<div class="slot ${order[i]!==undefined?'filled':''}">${i+1}. ${order[i]!==undefined?names[order[i]]:'?'}</div>`).join('')}</div><div class="choices">${[4,0,6,2,7,3,1,5].filter(i=>!order.includes(i)).map(i=>`<button class="choice" onclick="pickOrder(${i})">${names[i]}</button>`).join('')}</div><p id="feedback" class="feedback">${order.length===8?t('🎉 Perfect journey!','🎉 ¡Recorrido perfecto!'):''}</p><button class="primary" onclick="order=[];render()">↻ ${t('Start again','Reiniciar')}</button>`}
function pickOrder(i){if(i===path[order.length]){order.push(i);render()}else $('feedback').textContent=t('Try again!','¡Inténtalo de nuevo!')}
const quizIds=[8,4,9,2,10,5,3,7];let quizIndex=0;
function quizScreen(){let id=quizIds[quizIndex%quizIds.length],options=[id,(id+4)%11,(id+7)%11].sort((a,b)=>((a*3+quizIndex)%11)-((b*3+quizIndex)%11));return `<h1>❓ ${t('Guess the organ','Adivina el órgano')}</h1><div class="score">${quizIndex+1} / ${quizIds.length}</div><p class="question">${t('I am an organ that...','Soy un órgano que...')} ${descriptions[id][lang==='en'?0:1].toLowerCase()}</p><div class="choices">${options.map(i=>`<button class="choice" onclick="checkMatch(this,${i},${id})">${names[i]}</button>`).join('')}</div><p class="feedback" id="feedback"></p><button class="primary" onclick="quizIndex=(quizIndex+1)%${quizIds.length};render()">${t('Next clue →','Siguiente pista →')}</button>`}
function finalScreen(){return `<h1>🏆 ${t('Final Challenge','Reto final')}</h1><p class="sub">${t('Can you remember everything? Choose the correct answer for each question.','¿Lo recuerdas todo? Elige la respuesta correcta para cada pregunta.')}</p>${[8,4,3,5,7].map((id,k)=>`<div class="card" style="margin:12px 0"><b>${k+1}. ${descriptions[id][lang==='en'?0:1]}</b><div class="choices">${[id,(id+2)%11,(id+5)%11].sort((a,b)=>((a*5+k)%13)-((b*5+k)%13)).map(i=>`<button class="choice ${done[k]===i?'correct':''}" onclick="finalCheck(this,${k},${i},${id})">${names[i]}</button>`).join('')}</div></div>`).join('')}<p class="feedback" id="feedback">${Object.keys(done).length===5?t('🎉 Congratulations, scientist! You completed the challenge!','🎉 ¡Enhorabuena, científico! ¡Has completado el reto!'):t('Correct answers: ','Respuestas correctas: ')+Object.keys(done).length+'/5'}</p><button class="primary" onclick="done={};render()">↻ ${t('Play again','Volver a jugar')}</button>`}
function finalCheck(el,k,i,id){if(i===id){done[k]=i;render()}else{el.classList.add('wrong');$('feedback').textContent=t('Try again!','¡Inténtalo de nuevo!')}}render();
</script></body></html>
